[project]
name = "fast-engine-startup"
version = "0.1.0"
description = "Measuring and shortening SGLang engine startup on Modal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "modal>=1.5.5",
    "psycopg[binary]>=3.2",
]

[project.scripts]
fes-control-plane = "fes.control_plane:main"   # --role api | worker | all
fes-bench = "fes.bench:main"
fes-sync-results = "fes.dashboard:main"   # pull runs from the fes-results volume

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fes"]
